# Mosquitto 운영 설정 (전환 기간)

# 이 파일은 "현재" 운영 Broker 설정이다. ESP32 #1·#2, Edge Subscriber, 공식 MQTT
# Scenario/Test Tool의 Credential이 모두 준비되고 정상 연결까지 검증되기 전까지는
# allow_anonymous를 false로 바꾸지 않는다("전환 순서" 6번 단계 전까지 유지).

# 중요: acl_file / password_file을 이 파일에 미리 추가하지 않는다. 실측 결과,
# allow_anonymous true 상태에서 acl_file만 먼저 추가해도 그 acl_file에 정의되지
# 않은(Anonymous에 대응하는 규칙이 없는) 익명 Client는 CONNECT는 성공하지만 PUBLISH가
# 즉시 Broker 단계에서 거부된다(Broker 로그에 "Denied PUBLISH"로 남는다). 즉 acl_file
# 도입 자체가 "정상 MQTT 연결은 인증·ACL 적용 후에도 유지되고"라는 완료 기준을 깨뜨릴
# 수 있다. 그래서 acl_file/password_file은 mosquitto-strict.conf로 분리하고, 별도
# 포트(Strict Test Listener)에서 먼저 검증한 뒤에만 이 파일을 mosquitto-strict.conf
# 내용으로 교체한다.

# 전환 순서:
#   1. 기존 Mosquitto 설정 Backup
#   2. Password/ACL 정책 파일 준비 → passwd.example, aclfile.conf 참고
#   3~5. Subscriber/ESP32/Test Tool Credential 지원
#   6. Broker 강제 전 Credential 기반 정상 Client 연결 Smoke
#        → mosquitto-strict.conf를 별도 Listener/Port로 띄워 Own Topic PASS,
#          Anonymous DENY, Cross Topic DENY, Wrong Password DENY를 먼저 확인한다.
#   7. Broker 인증·ACL 활성화
#        → 이 파일(mosquitto.conf)을 mosquitto-strict.conf 내용으로 교체한다.
#   8~12. 정상 Subscribe/Publish, 익명 DENY, Cross Topic DENY, Payload mismatch
#         Application Detection 확인
#   13. 이상 시 Backup Mosquitto 설정으로 Rollback

# Phase 6-A의 MQTT 인증·ACL은 접근제어 강화다. TCP 1883을 계속 사용하는 동안 이를 MQTT 통신 암호화나 mTLS 기반 Device Identity라고 표현하지 않는다.

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true