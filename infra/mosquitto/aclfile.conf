# Mosquitto ACL 정책

# mosquitto-strict.conf의 acl_file이 참조하는 파일이다. 비밀번호는 담지 않는다
# (Principal ↔ Password 매핑은 passwd_file이 별도로 관리한다).

# 판정 규칙: acl_file이 설정되면 Mosquitto는 기본적으로 모든 Topic 접근을 거부하고,
# 아래 `user` 블록에 명시적으로 나열된 것만 허용한다. `topic write`는 Publish,
# `topic read`는 Subscribe 권한이다. 이 파일에 없는 Principal이나, 있어도 명시되지 않은 Topic은 항상 거부된다.

# ── ESP32 실기기 ──────────────────────────────────────────────────────────────
# 각 ESP32는 자기 Sensor Topic에만 Publish할 수 있다. Subscribe 권한은 없다.
# (Sensor 전송만 하고 Broker로부터 받을 메시지가 없음)

user esp32_01
topic write iot/esp32_01/sensor

user esp32_02
topic write iot/esp32_02/sensor

# ── Edge MQTT Subscriber (edge/mqtt/subscriber.py) ────────────────────────────
# 모든 등록 기기의 Sensor Topic을 Subscribe만 한다. Publish 권한은 없다.

user edge_subscriber
topic read iot/+/sensor

# ── 공식 MQTT Scenario/Test Tool (attacks/*, edge/scenarios/run_scenario.py) ──

user mqtt_test_tool
topic write #
topic read #

# ── Anonymous ──────────────────────────────────────────────────────────────
# 별도 `user` 블록이 없으므로 Anonymous는 이 파일에서 아무 Topic도 허용받지 못한다.
# mosquitto-strict.conf의 `allow_anonymous false`와 함께 적용해야
# CONNECT 자체가 거부된다(allow_anonymous true인 전환 기간에는 CONNECT는
# 성공하지만 이 acl_file이 함께 로드된 경우 PUBLISH가 Broker 단계에서 거부된다 —
# 그래서 mosquitto.conf에는 이 acl_file을 아직 연결하지 않는다).
