# Mosquitto Strict 설정
#
# 이 파일은 운영 Port(1883/9001)를 그대로 사용하는 "최종 목표 설정"이다. 검증이
# 끝난 뒤 이 내용으로 실제 mosquitto.conf를 교체한다("전환 순서" 7번).
# 운영 Broker가 이미 이 Port로 실행 중인 상태에서 이 파일을 그대로 별도 프로세스로
# 띄우면 Port 충돌이 난다 — 사전 검증(Strict Test Listener)에는 대신
# mosquitto-strict-test.conf(별도 Port 18831/18901)를 사용한다.

# 이 파일은 실제 Mosquitto Broker로 검증했다(mosquitto 2.0.18, apt 패키지,
# mosquitto-strict-test.conf와 동일한 password_file/acl_file 내용으로 검증):
#   - esp32_01 Credential로 iot/esp32_01/sensor Publish → PASS
#   - esp32_02 Credential로 iot/esp32_02/sensor Publish → PASS
#   - esp32_02 Credential로 iot/esp32_01/sensor Publish → Denied PUBLISH
#   - 잘못된 Password → CONNACK reason code 5(Not Authorized), 연결 거부
#   - Credential 없이 연결 → CONNACK reason code 5, 연결 거부
#   - edge_subscriber Credential로 iot/+/sensor Subscribe → PASS(SUBACK)
#   - edge_subscriber Credential로 Publish 시도 → Denied PUBLISH(Read-only)
# (edge/scripts/mqtt_acl_test_pack.py로 위 Check를 자동화했고, Nonce 기반
# 메시지 매칭으로 동시 운영 트래픽이 섞여도 오판하지 않음을 별도로 확인했다.)

# 필수 준비물:
#   - password_file: infra/mosquitto/passwd.example의 안내를 따라
#     `mosquitto_passwd`로 직접 생성한다(이 저장소에는 실제 비밀번호/해시를 커밋하지
#     않는다).
#   - acl_file: infra/mosquitto/aclfile.conf (이 저장소에 포함, Principal 이름만
#     있고 비밀번호는 없음).

# 배포 시 두 파일 모두 mosquitto 사용자 소유·0600 권한을 권장한다:
#   sudo chown mosquitto:mosquitto /etc/mosquitto/passwd /etc/mosquitto/aclfile.conf
#   sudo chmod 0600 /etc/mosquitto/passwd /etc/mosquitto/aclfile.conf
# (권한이 열려 있으면 Mosquitto가 시작 시 Warning을 남기고, 향후 버전에서는 로드 자체를 거부할 예정이다.)

per_listener_settings true

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile.conf

listener 9001
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile.conf
