# Hanium IoT Edge Zero Trust — Mosquitto Strict Test Listener (Phase 6-A 5.3)
#
# 운영 Broker(mosquitto.conf, 1883/9001, 여전히 allow_anonymous true)가 실행
# 중인 상태에서도 그대로 띄울 수 있도록, mosquitto-strict.conf와 다른 전용
# Port(18831/18901)를 사용한다. "전환 순서" 6번(Broker 강제 전 Credential 기반
# 정상 Client 연결 Smoke)에서 이 파일을 그대로 사용하면 된다 — Port를 수동으로
# 바꿀 필요가 없다.
#
# mosquitto-strict.conf(1883/9001, 운영 Port와 동일)와는 용도가 다르다:
#   - mosquitto-strict-test.conf(이 파일): 운영 Broker와 동시에 띄워 미리 검증만
#     하는 전용 Listener. 절대 운영 mosquitto.conf에 그대로 옮기지 않는다.
#   - mosquitto-strict.conf: 검증이 끝난 뒤 실제 mosquitto.conf 내용을 교체할
#     최종 목표 설정(운영 Port 1883/9001 그대로 사용).
#
# 실행 방법:
#   mosquitto -c infra/mosquitto/mosquitto-strict-test.conf
#   python -m edge.scripts.mqtt_acl_test_pack --host <Pi IP> --port 18831 ...
#
# 필수 준비물은 mosquitto-strict.conf와 동일하다(passwd.example, aclfile.conf
# 참고).

per_listener_settings true

listener 18831
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile.conf

listener 18901
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile.conf
