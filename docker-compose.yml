services:
  postgres:
    image: postgres:16
    container_name: haniot-postgres
    environment:
      POSTGRES_DB: mqtt_security
      POSTGRES_USER: mqtt_user
      POSTGRES_PASSWORD: mqtt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: haniot-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres-data:

